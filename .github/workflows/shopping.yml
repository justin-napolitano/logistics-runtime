name: Portable shopping worker
on:
  push:
    branches: [main]
    paths: ['tools/shop/**', '.github/workflows/shopping.yml']
  pull_request:
    paths: ['tools/shop/**', '.github/workflows/shopping.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: tools/shop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q
      - run: uv run shop validate examples/example.json
      - run: uv build
